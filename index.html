<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#03060f">
  <title>消失中</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 起始畫面 -->
  <section id="start" class="screen">
    <div class="start-inner">
      <p class="eyebrow" id="start-site"></p>
      <h1 class="title glitch" data-text="消失中">消失中</h1>
      <p class="lede">舉起手機，看見這裡還剩多少。</p>
      <button id="enter" class="btn">進入</button>
      <p class="fine" id="start-msg">這件作品需要相機、位置與方向感測。<br>位置只在你的手機上使用，不會上傳。</p>
    </div>
  </section>

  <!-- 不在場域內 -->
  <section id="away" class="screen" hidden>
    <div class="start-inner">
      <p class="eyebrow">你不在這裡</p>
      <h1 class="title" id="away-dist">—</h1>
      <p class="lede" id="away-place"></p>
      <p class="fine">這件作品只存在於那個地方。<br>走進去，它才會出現。</p>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="stage" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="simbg"><span>模擬定位（開發用）</span></div>
    <div id="scan"></div>

    <div id="hud"></div>
    <div id="empty" hidden>轉動手機，尋找還在的建築</div>

    <div id="mini">
      <div id="map"></div>
      <div id="me"></div>
      <div id="avg"><span>校區</span><b id="avg-num">—</b></div>
    </div>
    <p id="credit">© OpenStreetMap</p>

    <div id="simpanel" hidden>
      <button data-k="q">⟲</button><button data-k="w">▲</button><button data-k="e">⟳</button>
      <button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button>
    </div>

    <!-- 傷害紀錄 -->
    <div id="log" hidden>
      <div class="log-head">
        <div>
          <h2 id="log-name"></h2>
          <p id="log-meta"></p>
        </div>
        <button id="log-close" aria-label="關閉">✕</button>
      </div>
      <div class="log-hp">
        <div class="track"><div class="fill" id="log-fill"></div></div>
        <b id="log-num"></b>
      </div>
      <ol id="log-list"></ol>
      <p class="log-foot">數字是這件作品的詮釋；每一筆原因都是查得到的事實。</p>
    </div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="sites/nanda/footprints.js"></script>
  <script src="sites/nanda/site.js"></script>
  <script src="js/core.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
